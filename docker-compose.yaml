services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  streamlit:
    build: .
    container_name: streamlit_app
    depends_on:
      - qdrant
    ports:
      - "8501:8501"
    environment:
      - QDRANT_HOST=${QDRANT_HOST}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

volumes:
  qdrant_data:
